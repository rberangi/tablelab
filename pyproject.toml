[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tablelab"
dynamic = ["version"]
description = "Notebook GUI for table inspection, query pipelines, charts, and Pandas/PySpark/Spark SQL code generation"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Reza Berangi", email = "rberangi@gmail.com" }]
keywords = ["jupyter", "ipywidgets", "pandas", "table", "data inspection",
            "query", "sql", "pyspark", "visualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Jupyter",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "matplotlib>=3.9",
    "ipywidgets>=8.0",
    "certifi>=2024.2.2",
]

[project.optional-dependencies]
excel   = ["openpyxl"]              # .xlsx / .xls
parquet = ["pyarrow"]               # .parquet, .feather, .arrow
zoom    = ["ipympl>=0.9"]           # pan/zoom toolbar on the run chart
all     = ["openpyxl", "pyarrow", "ipympl>=0.9"]
release = ["build>=1.2", "twine>=5"]
dev     = ["pytest>=7", "nbformat", "nbconvert", "jupyterlab", "sqlglot>=25", "duckdb>=1"]

[project.scripts]
tablelab = "tablelab.__main__:main"

[project.urls]
Homepage = "https://github.com/rberangi/tablelab"
Source   = "https://github.com/rberangi/tablelab"
Issues   = "https://github.com/rberangi/tablelab/issues"

[tool.hatch.version]
path = "src/tablelab/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tablelab"]

[tool.hatch.build.targets.sdist]
include = [
    "src/tablelab", "tests", "pyproject.toml", "README.md", "LICENSE",
    "CHANGELOG.md", "RELEASING.md", "examples/chart_gui.ipynb",
    "examples/tablelab_queries.ipynb", "examples/data/*.csv",
]
exclude = ["**/__pycache__", "**/*.pyc", "**/.ipynb_checkpoints", "**/.DS_Store"]
